version: 2

# Задание 3. Описания и тесты staging-моделей.
# Для stg_shop__orders часть тестов уже есть — допишите остальное по образцу.

models:
  - name: stg_shop__orders
    description: "Заказы из источника: одна строка — один заказ."
    columns:
      - name: order_id
        description: "Номер заказа."
        data_tests: [unique, not_null]

      - name: customer_id
        description: "Клиент, оформивший заказ."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id

      - name: order_status
        description: "Статус заказа."
        data_tests:
          - accepted_values:
              arguments:
                values: ['paid', 'pending', 'returned', 'cancelled', 'test']
      - name: order_amount
        description: "Сумма заказа в рублях после скидок."


  - name: stg_shop__customers
    description: "Клиенты из источника: одна строка - один клиент"
    columns:
      - name: customer_id
        description: "Идентификатор клиента"
        data_tests:
          - unique
          - not_null

  
  - name: stg_shop__order_items
    description: "Товары в заказе: одна строка - позиция в заказе"
    columns:
      - name: order_id
        description: "Номер заказа"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      
      - name: order_item_id
        description: "Идентификатор заказ - позиция"
        data_tests:
          - not_null
          - unique


  - name: stg_shop__payments
    description: "Одна строка - один платёж"
    columns:
      - name: payment_id
        description: "Номер платежа"
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Номер заказа"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id

      - name: payment_status
        description: "Статус платежа" 
        data_tests:
          - accepted_values:
              arguments:
                values: ['success', 'failed', 'pending']


  - name: stg_shop__products
    description: "Одна строка - один товар"
    columns:
      - name: product_id
        description: "Идентификатор товара"
        data_tests:
          - unique,
          - not_null
      
      - name: category
        description: "Название категории товара"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__product_categories')
                field: category_name
      
      - name: brand
        description: "Изготовитель товара"

      - name: product_name
        description: "Имя товара"


  - name: stg_shop__product_categories
    description: "Одна строка - одна категория товара"
    columns:
      - name: category_id
        description: "Номер категории товара"
        data_tests:
          - unique
          - not_null
      
      - name: parent_category_id
        description: "Номер общей категории товара (если есть)"

      - name: category_name
        description: "Название категории товара"
