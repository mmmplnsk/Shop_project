models:
  - name: fct_orders
    description: "Фактовая таблица заказов. Одна строка - один заказ"
    columns:
      - name: order_id
        description:  "Номер заказа"
        data_tests:
          - unique
          - not_null
      
      - name: customer_id
        description: "Идентификатор клиента"

      - name: order_date
        description: "Дата создания заказа"

      - name: ordered_at
        description: "Время создания заказа"

      - name: order_status
        description: "Статус заказа"

      - name: order_amount
        description: "Сумма заказа"

      - name: paid_amount
        description: "Сумма успешных платажей"

      - name: refunded_amount
        description: "Сумма возвратных платежей"

      - name: net_paid_amount
        description: "Сумма успешных платежей - сумма возвратных"

      - name: successful_payments_count
        description: "Число успешных платежей"

      - name: first_paid_at
        description: "Дата первого успешного платежа"

      - name: is_confirmed
        description: "Заказ с > 0 успешных оплат"
        data_tests:
          - not_null
      
      - name: items_count
        description: "Число различных товаров в заказе"

  
  - name: dim_dates
    description: "Календарное измерение. Одна строка - один календарный день"
    columns:
      - name: date_day
        description: "Календарная дата"
        data_tests:
          - not_null
          - unique

      - name: is_weekend
        description: "Флаг выходного дня"
        data test:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]

  - name: dim_products
    description: "Одна строка - один факт о товаре"
    columns:
      - name: product_id
        description: "Номер товара"
        data_tests:
          - unique
          - not_null
          
      - name: product_name
        description: "Имя товара"

      - name: brand
        description: "Изготовитель товара"

      - name: category_name
        description: "Имя категории"

      - name: parent_category_name
        description: "Имя родительской категории (если есть)"

      - name: root_category_name
        description: "Имя первичной категории"


  - name: fct_order_items
    description: "Одна строка - одна позиция в заказе"
    columns:
      - name: product_id
        description: "Номер товара"

      - name: customer_id
        description: "Идентификатор клиента"

      - name: quantity
        description: "Количество товара"

      - name: unit_price
        description: "Цена за штуку товара"

      - name: discount_amount,
        description: "Сумма скидки"

      - name: line_amount
        description: "Сумма позиции в заказе"

      - name: is_confirmed
        description: "Флаг подтвержденного заказа"
      
      


